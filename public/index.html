<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d6b5c">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Dealer Credit Ledger</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<script src="/fonts.js" data-href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;500;600;700&display=swap"></script>
<link rel="stylesheet" href="/app.css">
</head>
<body>

<header>
  <div class="wrap">
    <div class="top">
      <div class="brand"><h1 id="storeName">Dealer Credit Ledger</h1><small id="sync" class="status">Connecting…</small><small id="acct" class="status"></small></div>
      <button class="btn icon-btn" id="btnSearch" type="button" aria-label="Search (Ctrl+K)" title="Search (Ctrl+K)"><span class="ic"></span><span class="kbd">Ctrl K</span></button>
      <div class="actions" id="topActions" hidden>
        <button class="btn primary" data-act="new-sale" type="button">+ Credit sale</button>
        <button class="btn" data-act="new-pay" type="button">+ Payment</button>
      </div>
    </div>
    <nav class="tabs" aria-label="Sections">
      <button class="tab" data-view="overview" type="button">Overview</button>
      <button class="tab" data-view="dash" type="button" id="dashTab" hidden>Dashboard</button>
      <button class="tab" data-view="orders" type="button" id="ordersTab" hidden>Orders <span class="pill bad" id="ordBadge" hidden></span></button>
      <button class="tab" data-view="collect" type="button">Collections</button>
      <button class="tab" data-view="dealers" type="button">Dealers</button>
      <button class="tab" data-view="products" type="button">Products</button>
      <button class="tab" data-view="activity" type="button">Transactions</button>
      <button class="tab" data-view="reports" type="button">Reports</button>
      <button class="tab" data-view="store" type="button">Store</button>
    </nav>
  </div>
</header>
<main class="wrap" id="main" aria-busy="true">
  <div class="kpis" aria-hidden="true"><div class="kpi skel-card"><i class="skel w40"></i><i class="skel w70 tall"></i><i class="skel w50"></i></div><div class="kpi skel-card"><i class="skel w40"></i><i class="skel w70 tall"></i><i class="skel w50"></i></div><div class="kpi skel-card"><i class="skel w40"></i><i class="skel w70 tall"></i><i class="skel w50"></i></div><div class="kpi skel-card"><i class="skel w40"></i><i class="skel w70 tall"></i><i class="skel w50"></i></div></div>
  <section class="panel" aria-label="Loading your ledger"><i class="skel w30"></i><i class="skel w100"></i><i class="skel w100"></i><i class="skel w80"></i><i class="skel w100"></i><p class="small muted" style="margin:10px 0 0">Loading dealers, products, credit sales and payments…</p></section>
</main>
<nav class="bnav" id="bnav" aria-label="Main"></nav>
<button class="fab" id="fab" type="button" aria-label="New sale, payment, return…" hidden></button>
<div id="sheetRoot"></div>

<script src="/shim.js"></script>
<script src="/credit.js"></script>
<script src="/app.js"></script>

</body>
</html>
