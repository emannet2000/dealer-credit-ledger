<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d6b5c">
<title>My Account · Dealer Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow column for phones; balance card first, then tabs for unpaid, history, catalog, account. */
:root{
  --bg:#f5f7f6; --surface:#fff; --sunk:#eaefed; --line:#d5dedb; --fg:#15211e; --muted:#5b6b67;
  --accent:#0d6b5c; --accent-fg:#fff; --accent-soft:#d8ece7;
  --warn:#a35a00; --warn-soft:#fbecd6; --bad:#b3261e; --bad-soft:#f9dedc; --good:#1f7a3a; --good-soft:#dcf1e1;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Public Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; --r:12px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1514; --surface:#172120; --sunk:#111a19; --line:#2a3836; --fg:#e3ece9; --muted:#93a5a0;
  --accent:#4cc3a9; --accent-fg:#06201b; --accent-soft:#16352f;
  --warn:#f0a648; --warn-soft:#3a2a12; --bad:#f2847b; --bad-soft:#3d1d1a; --good:#6fd18c; --good-soft:#163222; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.2;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px}
header{padding-block:18px 8px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
header h1{font-size:22px}
.btn{font:600 14px var(--f-body);border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
.bal .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.bal .big{font-family:var(--f-display);font-size:38px;font-weight:700;margin:2px 0 10px}
.bal-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px;border-top:1px solid var(--line);padding-top:12px}
.bal-grid b{display:block;font-size:17px}
.bad-t{color:var(--bad)}
.notice{border-radius:var(--r);padding:12px 14px;margin-bottom:14px;font-size:14px}
.notice.bad{background:var(--bad-soft)} .notice.warn{background:var(--warn-soft)} .notice.info{background:var(--accent-soft)}
.pay{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.pay p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:6px 0 12px;overflow-x:auto}
.tab{border:0;background:none;color:var(--muted);font:600 14px var(--f-body);padding:10px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.list{display:flex;flex-direction:column;gap:8px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;gap:12px;cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit}
.row:hover{background:var(--sunk)}
.row .r{text-align:right;white-space:nowrap}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.neutral{background:var(--sunk);color:var(--muted)}
.void{opacity:.55} .void .amt{text-decoration:line-through}
.cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.prod{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.prod .ph{aspect-ratio:1;background:var(--sunk);display:grid;place-items:center;color:var(--muted);font-size:12px;max-width:100%}
.prod img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.prod div.t{padding:8px 10px;display:flex;flex-direction:column;gap:2px;font-size:13px;min-width:0}
.prod b{font-size:14px;overflow-wrap:anywhere}
input{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
form{display:flex;flex-direction:column;gap:12px}
.empty{text-align:center;color:var(--muted);padding:24px 8px}
dl.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 16px;margin:0;font-size:14px}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0}
.overlay{position:fixed;inset:0;background:rgba(5,15,13,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--bg);width:min(640px,100%);max-height:92vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.receipt{background:#fff;color:#111;border-radius:10px;padding:18px;font-size:14px;border:1px solid var(--line)}
.receipt table{width:100%;border-collapse:collapse;font-size:13px;margin:10px 0}
.receipt th{text-align:left;color:#555;font-size:11px;text-transform:uppercase;border-bottom:1px solid #999;padding:4px}
.receipt td{border-bottom:1px solid #ddd;padding:5px 4px}
.receipt .r{text-align:right}
.rc-total{display:flex;justify-content:space-between;border-top:2px solid #111;padding-top:8px;font-weight:700}
.rc-total b{font-family:var(--f-display);font-size:20px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:40;font-weight:600;font-size:14px}
footer{padding-block:24px 96px;text-align:center}
.btn{transition:background-color .15s,border-color .15s,transform .08s}
.btn:active:not([disabled]){transform:scale(.97)}
.btn.primary{box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 28%,transparent)}
.tab{position:relative;border-bottom-color:transparent!important;transition:color .15s}
.tab::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--accent);transform:scaleX(0);transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.tab[aria-selected="true"]::after{transform:scaleX(1)}
.row{transition:background-color .12s,transform .08s}.row:active{transform:scale(.99)}
input{transition:border-color .15s,box-shadow .15s}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent);outline:none}
.prod{transition:border-color .15s,box-shadow .15s}.prod:has(.qty){border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 20%,transparent)}
.toast{display:flex;align-items:center;gap:8px;border-radius:12px!important;box-shadow:0 8px 24px rgba(0,0,0,.18);max-width:calc(100% - 32px)}
.toast svg{width:18px;height:18px;flex:none;color:var(--good)}
.skel{display:block;height:12px;border-radius:6px;margin:10px 0;background:linear-gradient(90deg,var(--sunk) 0%,color-mix(in srgb,var(--sunk) 40%,var(--surface)) 50%,var(--sunk) 100%);background-size:200% 100%}
.skel.tall{height:34px;width:60%}.skel.w40{width:40%}.skel.w80{width:80%}
.cartbar{transition:transform .25s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:no-preference){
  .overlay{animation:ovIn .2s ease-out}.modal{animation:upIn .28s cubic-bezier(.2,.8,.2,1)}
  .toast{animation:tIn .26s cubic-bezier(.2,.8,.2,1)}
  .skel{animation:shimmer 1.3s linear infinite}
  #main.tab-in .tabs~*{animation:fadeUp .22s ease-out}
  .cartbar:not([hidden]){animation:upIn .28s cubic-bezier(.2,.8,.2,1)}
  @keyframes ovIn{from{background:rgba(5,15,13,0)}}
  @keyframes upIn{from{transform:translateY(40px);opacity:.4}}
  @keyframes tIn{from{opacity:0;transform:translate(-50%,12px) scale(.96)}to{transform:translate(-50%,0)}}
  @keyframes shimmer{to{background-position:-200% 0}}
  @keyframes fadeUp{from{opacity:.5;transform:translateY(4px)}}
}
.qty{display:flex;align-items:center;gap:4px;margin-top:6px}
.qty input{width:48px;text-align:center;padding:5px 2px}
.qty .btn{padding:4px 10px;min-width:32px}
.add{margin-top:6px;width:100%}
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -6px 20px rgba(0,0,0,.08)}
.cartbar .in{max-width:640px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.otbl{width:100%;border-collapse:collapse;font-size:14px}
.otbl th{text-align:left;font-size:11px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding:6px 4px}
.otbl td{border-bottom:1px solid var(--line);padding:8px 4px;vertical-align:middle}
.otbl .r{text-align:right}
.tot{display:flex;justify-content:space-between;padding:4px 0}
.tot.g{font-weight:700;font-size:17px;border-top:1px solid var(--line);margin-top:4px;padding-top:8px}
.steps{display:flex;gap:4px;margin:10px 0}
.steps span{flex:1;height:6px;border-radius:3px;background:var(--sunk)}
.steps span.on{background:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <header><div><div class="small muted" id="store">Dealer portal</div><h1 id="hello">My account</h1></div><button class="btn sm" id="logout" type="button">Sign out</button></header>
  <main id="main" aria-busy="true"><div class="card" aria-label="Loading your account"><i class="skel w40"></i><i class="skel tall"></i><i class="skel w80"></i><i class="skel w80"></i></div><div class="card"><i class="skel w40"></i><i class="skel w80"></i></div></main>
  <footer class="small muted" id="sync"></footer>
</div>
<div class="cartbar" id="cartbar" hidden><div class="in"><div><b id="cb-n"></b><div class="small muted num" id="cb-t"></div></div><button class="btn primary" type="button" id="cb-go">Review order</button></div></div>
<div id="modalRoot"></div>
<script src="/portal.js"></script>
</body>
</html>
